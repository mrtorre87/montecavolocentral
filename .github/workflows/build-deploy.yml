name: Build e deploy sito

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  workflow_run:
    # I push fatti con il GITHUB_TOKEN di un altro workflow (come quello
    # che aggiorna i dati da Instagram) non fanno scattare "on: push", per
    # evitare loop infiniti. Quindi agganciamo la build direttamente al
    # completamento di quel workflow.
    workflows: ["Aggiorna dati da Instagram"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Se scatta a seguito di workflow_run, costruisci solo se quel workflow
    # e' andato a buon fine.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Genera il sito statico
        run: node scripts/generate.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
